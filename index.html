<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — Modern Todo</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-soft: #475569;
    --ink-faint: #94a3b8;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --danger: #ef4444;
    --border: #e5e7eb;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .app {
    width: 100%;
    max-width: 560px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .header .count {
    font-size: 14px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* Progress bar */
  .progress {
    height: 6px;
    background: #eef0f4;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress span {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #7c6ff0);
    border-radius: 99px;
    transition: width .35s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--ink-faint);
    text-align: right;
    margin-top: 6px;
    margin-bottom: 18px;
  }

  /* Add form */
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .add-form input {
    flex: 1;
    padding: 13px 16px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .add-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .add-form button {
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .add-form button:hover { background: #4338ca; }
  .add-form button:active { transform: scale(.97); }

  /* Filters */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .filters button {
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border: none;
    border-radius: 99px;
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s;
  }
  .filters button.active {
    background: var(--ink);
    color: #fff;
  }

  /* List */
  ul.todo-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    transition: opacity .2s, transform .2s;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .todo-item.removing {
    opacity: 0;
    transform: translateX(12px);
  }
  .todo-item .check {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border: 2px solid #cbd5e1;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  .todo-item .check:hover { border-color: var(--accent); }
  .todo-item .check svg {
    width: 12px; height: 12px;
    stroke: #fff; stroke-width: 3;
    fill: none;
    opacity: 0;
    transition: opacity .15s;
  }
  .todo-item.done .check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .todo-item.done .check svg { opacity: 1; }
  .todo-item .text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    transition: color .2s;
  }
  .todo-item.done .text {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: #cbd5e1;
  }
  .todo-item .del {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    transition: all .15s;
  }
  .todo-item .del:hover {
    background: #fef2f2;
    color: var(--danger);
  }
  .todo-item .del svg { width: 16px; height: 16px; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 48px 16px;
    color: var(--ink-faint);
  }
  .empty .icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 15px; }

  /* Clear done */
  .clear-done {
    margin-top: 16px;
    text-align: center;
  }
  .clear-done button {
    font-size: 13px;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .clear-done button:hover { color: var(--danger); }

  /* Rabbit mascot */
  .header .rabbit-logo {
    width: 44px; height: 44px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 2px 8px rgba(15,23,42,.14);
    flex-shrink: 0;
  }
  .header .title-block { display: flex; flex-direction: column; gap: 2px; }
  .header .title-block .sub { font-size: 12px; color: var(--ink-faint); }
  .empty .rabbit-empty {
    width: 92px; height: 92px;
    border-radius: 20px;
    object-fit: cover;
    box-shadow: 0 4px 14px rgba(15,23,42,.12);
    margin: 0 auto 14px;
    display: block;
  }
</style>
</head>

<script>

  const KEY = 'modern-todo-v1';
  let todos = load();
  let filter = 'all';

  // ---- persistence ----
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(todos));
  }

  // ---- elements ----
  const form = document.getElementById('add-form');
  const input = document.getElementById('new-task');
  const list = document.getElementById('list');
  const countEl = document.getElementById('count');
  const bar = document.getElementById('progress-bar');
  const progLabel = document.getElementById('progress-label');
  const clearWrap = document.getElementById('clear-done-wrap');
  const clearBtn = document.getElementById('clear-done');
  const filterBtns = document.querySelectorAll('#filters button');

  // ---- actions ----
  function addTask(text) {
    todos.unshift({ id: Date.now(), text: text.trim(), done: false });
    save(); render();
  }
  function toggleTask(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }
  function deleteTask(id) {
    const el = list.querySelector(`[data-id="${id}"]`);
    if (el) {
      el.classList.add('removing');
      setTimeout(() => {
        todos = todos.filter(t => t.id !== id);
        save(); render();
      }, 180);
    } else {
      todos = todos.filter(t => t.id !== id);
      save(); render();
    }
  }
  function clearDone() {
    todos = todos.filter(t => !t.done);
    save(); render();
  }
  function setFilter(f) {
    filter = f;
    filterBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    render();
  }

abbit"><p>Nothing here yet. Add your first task 🐇</p>'
        : '<div class="icon">✓</div><p>No ' + filter + ' tasks.</p>';
      list.appendChild(empty);
    } else {
      for (const t of visible) {
        const li = document.createElement('li');
        li.className = 'todo-item' + (t.done ? ' done' : '');
        li.dataset.id = t.id;
        li.innerHTML = `
          <div class="check" role="checkbox" aria-checked="${t.done}" tabindex="0" title="Toggle done">
            <svg viewBox="0 0 16 16"><polyline points="3,8.5 6.5,12 13,4.5"/></svg>
          </div>
          <span class="text"></span>
          <button class="del" title="Delete" aria-label="Delete task">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M4 4l8 8M12 4l-8 8"/>
            </svg>
          </button>`;
        li.querySelector('.text').textContent = t.text; // safe text
        li.querySelector('.check').addEventListener('click', () => toggleTask(t.id));
        li.querySelector('.check').addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTask(t.id); }
        });
        li.querySelector('.del').addEventListener('click', () => deleteTask(t.id));
        list.appendChild(li);
      }
    }

    // stats
    const total = todos.length;
    const done = todos.filter(t => t.done).length;
    countEl.textContent = total === 0 ? '' : `${done}/${total} done`;
    const pct = total ? Math.round(done / total * 100) : 0;
    bar.style.width = pct + '%';
    progLabel.textContent = total === 0 ? 'No tasks yet' : (pct === 100 ? 'All done 🎉' : `${pct}% complete`);
    clearWrap.hidden = done === 0;
  }

  // ---- events ----
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    addTask(v);
    input.value = '';
    input.focus();
  });
  clearBtn.addEventListener('click', clearDone);
  filterBtns.forEach(b => b.addEventListener('click', () => setFilter(b.dataset.filter)));

  render();
})();
</script>
